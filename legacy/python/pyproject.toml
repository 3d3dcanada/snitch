[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snitch-tools"
version = "0.1.0"
description = "snitch, no-comment and credit: find out what your image is telling people, make it stop, or put your name on it."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Randall Marshall", email = "info@3d3d.ca" }]
keywords = ["metadata", "iptc", "xmp", "exif", "c2pa", "content-credentials",
            "watermark", "copyright", "attribution", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
# 10.3 is the first Pillow with a py.typed marker. Below it, `mypy snitch` fails on an
# otherwise healthy install, so this floor is a type-checking requirement.
dependencies = ["Pillow>=10.3"]

[project.optional-dependencies]
# The MCP server is an extra, not a dependency. The official SDK requires Python 3.10+, and the
# three commands work fine on 3.9, so raising the whole package's floor to gain one optional
# surface would drop users for nothing. `pip install snitch-tools[mcp]` simply refuses on 3.9.
mcp = ["mcp>=2.1"]
test = ["pytest>=8.0"]
dev = [
  "build>=1.2",
  "mcp>=2.1; python_version >= '3.10'",
  "mypy>=1.11,<2",
  "pytest>=8.0",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://3d3d.ca"
Source = "https://github.com/3d3dcanada/snitch"

[project.scripts]
snitch = "snitch.cli:snitch_main"
no-comment = "snitch.cli:nocomment_main"
credit = "snitch.cli:credit_main"
snitch-mcp = "snitch.mcp:main"

[tool.setuptools.packages.find]
include = ["snitch*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE001", "PLW1510", "SIM"]

[tool.mypy]
python_version = "3.9"
files = ["snitch"]
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

# The MCP SDK's own floor is 3.10 and its source uses match statements, which mypy cannot parse
# while targeting 3.9. Our code is what is being checked here, and snitch/mcp.py imports the SDK
# lazily so the module still loads on 3.9 and says what is missing.
[[tool.mypy.overrides]]
module = "mcp.*"
follow_imports = "skip"
ignore_missing_imports = true
