[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snitch-tools"
version = "0.1.0"
description = "snitch, no-comment and credit: find out what your image is telling people, make it stop, or put your name on it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Randall Marshall", email = "info@3d3d.ca" }]
keywords = ["metadata", "iptc", "xmp", "exif", "c2pa", "content-credentials",
            "watermark", "copyright", "attribution", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://3d3d.ca"
Source = "https://github.com/3d3dcanada/snitch"

[project.scripts]
snitch = "snitch.cli:snitch_main"
no-comment = "snitch.cli:nocomment_main"
credit = "snitch.cli:credit_main"

[tool.setuptools.packages.find]
include = ["snitch*"]
