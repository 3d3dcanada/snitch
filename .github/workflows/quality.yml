name: quality

on:
  push:
  pull_request:

# Every action is pinned to a commit SHA, not a tag: a tag can be repointed at
# different code by whoever owns the repository, and these run with our token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # ExifTool is not optional: the tests that read and write real metadata skip without it, and
      # a green run that silently skipped half the suite is worse than a red one.
      - name: Install ExifTool on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libimage-exiftool-perl
      - name: Install ExifTool on macOS
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool on Windows
        if: runner.os == 'Windows'
        run: choco install exiftool --yes --no-progress

      # c2patool is what makes the C2PA tests real rather than a set of hand-written manifests.
      # Building it takes a while, so it runs on Linux only and the tests skip cleanly elsewhere.
      - name: Install c2patool on Linux
        if: runner.os == 'Linux'
        run: cargo install c2patool --locked

      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

      - name: Smoke-test the built binaries
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release
          "$BIN/snitch" --version
          "$BIN/no-comment" --version
          "$BIN/credit" --version
          "$BIN/snitch-mcp" --version
          "$BIN/snitch" --platforms | grep -q "researched"
          # A file with a location in it has to say so, and the strip has to prove the pixels held.
          "$BIN/snitch" --json --platforms > /dev/null
          echo "binaries answer"

  legacy-python:
    # The Python is the specification the Rust is checked against, so it has to keep passing.
    name: legacy python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes libimage-exiftool-perl
      - name: Install and test
        working-directory: legacy/python
        run: |
          python -m pip install --upgrade pip ".[dev]"
          ruff check snitch tests
          mypy snitch
          pytest -q
