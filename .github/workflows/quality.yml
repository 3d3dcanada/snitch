name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install ExifTool on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libimage-exiftool-perl
      - name: Install ExifTool on macOS
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool on Windows
        if: runner.os == 'Windows'
        run: choco install exiftool --yes --no-progress

      - name: Install package and development tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint
        run: ruff check snitch tests
      - name: Type-check
        run: mypy snitch
      - name: Test
        run: pytest -q

      - name: Build and inspect distributions
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the built wheel
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: |
          python -m venv /tmp/snitch-wheel-smoke
          /tmp/snitch-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/snitch-wheel-smoke/bin/snitch --version
          /tmp/snitch-wheel-smoke/bin/python -m snitch --version
